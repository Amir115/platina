name: Label Check

on:
  pull_request:
    types: [opened, labeled, unlabeled, reopened, synchronize]

jobs:
  check-label:
    runs-on: ubuntu-latest
    steps:
      - name: Require at least one category label
        uses: actions/github-script@v7
        with:
          script: |
            const required = ['Bug', 'Documentation', 'Enhancement', 'Infrastructure'];
            const labels = context.payload.pull_request.labels.map((l) => l.name);
            const hasRequired = labels.some((l) => required.includes(l));
            if (!hasRequired) {
              core.setFailed(
                `PR must have at least one of: ${required.join(', ')}`,
              );
            }
