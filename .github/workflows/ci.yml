name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  monday-link-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Require Monday.com item link in PR description
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const pattern = /https:\/\/amir-dana-personal\.monday\.com\/boards\/5096146634\/pulses\/\d+/;
            if (!pattern.test(body)) {
              core.setFailed(
                '❌ PR description must include a Monday.com item link (https://amir-dana-personal.monday.com/boards/...)',
              );
            }

  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/platina

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/platina
